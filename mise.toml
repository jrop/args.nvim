################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = { version = "5.1.5", install_env = { ASDF_LUA_LUAROCKS_VERSION = "3.12.2" } }
neovim = "0.12.6"
stylua = "2.6.0"
# `mise run release` publishes through the gh CLI:
gh = "2.103.3"
cargo-binstall = "1.26.2"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }

################################################################################
# Env
################################################################################

[env]
_.source = { path = "./scripts/env.sh", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
lint = "emmylua_check --warnings-as-errors --ignore '.prefix/**/*.*' ."
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = "luarocks test --prepare"

[tasks.test]
depends = ["test:prepare"]
run = "busted --verbose"

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks.ci]
run = '''
mise run fmt:check
mise run lint
mise run test
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

git submodule update --init --recursive
test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# The release serves the module as a single file, so a user can drop it into a
# `lua/` directory and `require 'args'` without cloning the repository.
mkdir -p dist
cp lua/args.lua dist/args.lua

# Run the published copy through plain Lua 5.1, and prepend its directory
# inside the chunk. mise's `lua` shim replaces LUA_PATH in the environment, so
# setting package.path here is what makes `require 'args'` load the copy.
lua -e "package.path = 'dist/?.lua;' .. package.path; local cli = require 'args'; local args = cli.parse({ add = { ['--force'] = 'boolean' } }, { 'add', '--force', 'file' }); assert(args.add['--force'] == true and args.add._[1] == 'file')"

# Hash from inside dist so the checksum names `args.lua`.
(cd dist && shasum -a 256 args.lua > args.lua.sha256)

gh release create "$tag" \
  dist/args.lua \
  dist/args.lua.sha256 \
  --generate-notes \
  --verify-tag
'''
