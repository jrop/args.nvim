################################################################################
## Tools
################################################################################

# Both emmylua tools ship in one GitHub release, and mise lists each repository
# once, so an alias gives each tool its own name and install directory.
[tool_alias]
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools]
"aqua:neovim/neovim" = "0.12.6"
stylua = "2.6.0"
# `mise run release` publishes through the gh CLI.
gh = "2.103.3"
"github:jrop/nvim-bundle" = "0.4.1"

[tools.emmylua_check]
version = "0.25.1"
bin = "emmylua_check"
platforms.linux-x64 = { asset_pattern = "emmylua_check-linux-x64.tar.gz" }
platforms.macos-arm64 = { asset_pattern = "emmylua_check-darwin-arm64.tar.gz" }
platforms.macos-x64 = { asset_pattern = "emmylua_check-darwin-x64.tar.gz" }

[tools.emmylua_ls]
version = "0.25.1"
bin = "emmylua_ls"
platforms.linux-x64 = { asset_pattern = "emmylua_ls-linux-x64.tar.gz" }
platforms.macos-arm64 = { asset_pattern = "emmylua_ls-darwin-arm64.tar.gz" }
platforms.macos-x64 = { asset_pattern = "emmylua_ls-darwin-x64.tar.gz" }

################################################################################
# Env
################################################################################

[env]
# .emmyrc.json loads Neovim's runtime as a type library through $VIMRUNTIME. An
# editor sets it for its language server, but a shell running `emmylua_check`
# does not.
VIMRUNTIME = { value = "{{ exec(command='nvim --clean --headless +\"lua io.stdout:write(vim.env.VIMRUNTIME)\" +qa') }}", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks.lint]
run = "emmylua_check --warnings-as-errors ."

[tasks."test:version"]
usage = '''
arg "<version>"
flag "--coverage"
'''
run = '''
tool="aqua:neovim/neovim@$usage_version"
[ "$usage_version" = nightly ] && tool='vfox:jdx/vfox-neovim@nightly'
# With auto-install off, `mise exec` on a missing version warns and runs the
# default `nvim` from PATH, so the suite would pass under the wrong version.
# Installing first makes a missing version an error instead.
mise install "$tool"
# The nightly tag moves, so refresh it when its checksum changed.
[ "$usage_version" = nightly ] && { mise upgrade "$tool" >/dev/null 2>&1 || true; }
mise exec "$tool" -- nvim --clean -l lua/args/vendor/test.lua ${usage_coverage:+--coverage}
'''

[tasks.test]
run = "mise run test:version 0.12.6"

[tasks."test:coverage"]
run = "mise run test:version --coverage 0.12.6"

[tasks.ci]
run = '''
mise run fmt:check
mise run lint
mise run test
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# The release serves the module as a single file, so a user can drop it into a
# `lua/` directory and `require 'args'` without cloning the repository.
mkdir -p dist
cp lua/args.lua dist/args.lua

# Load the published copy rather than lua/args.lua, so the check covers the
# file a user downloads. `--clean` keeps any installed copy off the runtime
# path, and the prepended package.path makes `require 'args'` find dist/ first.
nvim --clean -l /dev/stdin <<'LUA'
package.path = 'dist/?.lua;' .. package.path
local cli = require 'args'
local args = cli.parse({ add = { ['--force'] = 'boolean' } }, { 'add', '--force', 'file' })
assert(args.add['--force'] == true and args.add._[1] == 'file')
LUA

# Hash from inside dist so the checksum names `args.lua`.
(cd dist && shasum -a 256 args.lua > args.lua.sha256)

gh release create "$tag" \
  dist/args.lua \
  dist/args.lua.sha256 \
  --generate-notes \
  --verify-tag
'''
